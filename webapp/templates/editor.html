<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aistartups.cn — 定稿台</title>
<link rel="icon" type="image/jpeg" href="/images/gzh-logo.jpg">
<link rel="apple-touch-icon" href="/images/gzh-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="/static/vendor/marked.min.js"></script>
<link rel="stylesheet" href="/static/css/gzh2-base.css">
<link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
<header id="top-bar" class="top-bar">
  <a href="/"><img src="/images/gzh-logo.jpg" class="topbar-logo" alt="aistartups.cn"></a>
  <span class="page-label">定稿台</span>
  <span class="status-text" id="editor-company-label"></span>
  <span class="spacer"></span>
  <button id="btn-delete-company" class="btn-delete-company hidden" title="删除该公司全部数据">删除</button>
  <a class="top-link" href="/">研究台</a>
</header>

<main id="editor-workbench">
  <aside id="editor-left-pane">
    <!-- 套卡选择器 -->
    <div id="card-set-selector" class="card-set-selector">
      <!-- 由 editor.js 动态渲染 -->
    </div>

    <!-- 1. 卡片设置（主流程入口，默认展开） -->
    <div class="accordion-section" data-od-id="editor-card-settings">
      <div class="accordion-header open" data-section="card-settings">
        <span class="arrow">&#9654;</span> 卡片设置
      </div>
      <div class="accordion-body open" data-section="card-settings" data-od-id="editor-card-settings-body">
        <div id="card-settings-content" data-od-id="editor-card-settings-content">
          <!-- 由 card-settings-panel.js 动态渲染 -->
        </div>
      </div>
    </div>

    <!-- 2. 文字定稿 -->
    <div class="accordion-section" data-od-id="editor-text-finalize">
      <div class="accordion-header" data-section="text-finalize">
        <span class="arrow">&#9654;</span> 文字定稿
      </div>
      <div class="accordion-body" data-section="text-finalize" data-od-id="editor-text-finalize-body">
        <div id="text-finalize-content" data-od-id="editor-text-finalize-content">
          <!-- 由 text-finalize-panel.js 动态渲染 -->
        </div>
      </div>
    </div>

    <!-- 3. 图片定稿 -->
    <div class="accordion-section">
      <div class="accordion-header" data-section="image">
        <span class="arrow">&#9654;</span> 图片定稿
      </div>
      <div class="accordion-body" data-section="image">
        <div id="image-slot-list">
          <!-- 槽位列表由 editor.js 动态渲染 -->
        </div>
        <div id="image-slot-actions">
          <button id="btn-recollect-editor" class="btn-recollect-editor">重新采集图片</button>
          <p class="recollect-hint-editor">研究完成后自动采集，点此手动重试。</p>
        </div>
      </div>
    </div>

    <!-- 4. 数据库全字段 -->
    <div class="accordion-section">
      <div class="accordion-header" data-section="db-fields">
        <span class="arrow">&#9654;</span> 数据库全字段
      </div>
      <div class="accordion-body" data-section="db-fields">
        <!-- 入口按钮，点击后在右侧展示 -->
      </div>
    </div>

    <div class="editor-goto-layout" data-od-id="editor-goto-layout">
      <a id="btn-go-layout" class="go-layout-link" href="#" data-od-id="editor-btn-go-layout">进入排版 →</a>
    </div>
  </aside>

  <!-- 图片定稿 overlay -->
  <div id="image-studio-frame">
    <iframe id="image-studio-iframe" src="" title="图片定稿台"></iframe>
  </div>

  <!-- 卡片设置 overlay -->
  <div id="card-settings-mode">
    <div id="card-settings-mode-content" class="preview-content"></div>
  </div>

  <!-- 文字定稿 overlay -->
  <div id="text-finalize-mode">
    <div id="text-finalize-mode-content" class="preview-content"></div>
  </div>

  <!-- 数据库全字段 overlay -->
  <div id="db-fields-mode">
    <div class="db-fields-head">
      <span id="db-fields-title">数据库全字段</span>
      <span class="spacer"></span>
      <span id="db-fields-count"></span>
    </div>
    <div id="db-fields-table-wrap">
      <table id="db-fields-table">
        <thead><tr>
          <th>字段 Key</th>
          <th>标签</th>
          <th>分辨率</th>
          <th class="col-ver">Standard</th>
          <th class="col-ver">Business</th>
          <th class="col-ver">Spread</th>
          <th>定稿值</th>
          <th>状态</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/confirm.js"></script>
<script src="/static/js/editor.js"></script>

<!-- GZHv2 新面板 -->
<script src="/static/js/editor/card-settings-panel.js"></script>
<script src="/static/js/editor/text-finalize-panel.js?v=v3-field-values-3"></script>
<script src="/static/js/editor/db-fields-panel.js?v=all-fields-115"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const company = params.get('company') || '';
  if (!company) return;

  // 进入排版按钮 — 带当前套卡参数
  const setKey = params.get('set') || 'v1';
  const btnLayout = document.getElementById('btn-go-layout');
  if (btnLayout) btnLayout.href = `/layout?company=${encodeURIComponent(company)}&set=${setKey}`;
});
</script>
</body>
</html>
