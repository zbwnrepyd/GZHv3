    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: competition_context
  ecosystem_positioning:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: competition_context

  # -- 市场格局 --
  market_opportunity:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 1600
    max_evidence_chunks: 4
    sub_budget: market_context
  market_track:
    category: A
    resolution_type: official_fact
    if_missing: manual_needed
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: market_context
  market_subtrack:
    category: A
    resolution_type: official_fact
    if_missing: manual_needed
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: market_context
  market_landscape_summary:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 1600
    max_evidence_chunks: 4
    sub_budget: market_context
  market_landscape_top_players:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    type: json_text
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: market_context

  # -- 时间线 --
  timeline_events:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    type: json_text

  # -- 数据质量 --
  data_confidence:
    category: A
    resolution_type: official_fact
    if_missing: unavailable

  # -- 传播钩子段落 --
  hook_paragraph_1:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  hook_paragraph_2:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  hook_paragraph_3:
    category: A
    resolution_type: official_fact
    if_missing: unavailable

  # ── B 类：公式计算 ──
  mrr:
    category: B
    resolution_type: derived
    formula: arr / 12
    required_inputs: [arr]
    if_missing: unavailable
  ltv_cac_ratio:
    category: B
    resolution_type: derived
    formula: ltv / cac
    required_inputs: [ltv, cac]
    if_missing: unavailable
  funding_stage_score:
    category: B
    resolution_type: derived
    formula: FUNDING_MAP[funding_stage]
    required_inputs: [funding_stage]
    if_missing: derived
  funding_rounds:
    category: B
    resolution_type: derived
    formula: extract_rounds(funding_info)
    required_inputs: [funding_info]
    if_missing: unavailable

  # ── C 类：市场估算 ──
  tam:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    context_budget_tokens: 2200
    max_evidence_chunks: 6
    sub_budget: market_context
    required_context:
      - region
      - segment
      - year
      - source
    preferred_sources:
      - market_report
      - trusted_media
      - financial_database
    keywords:
      - TAM
      - total addressable market
      - market size
      - CAGR
      - 市场规模
  sam:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  som:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  market_cagr:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  market_size_source_note:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  market_size_value:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    context_budget_tokens: 1600
    max_evidence_chunks: 5
    sub_budget: market_context
  market_size_currency:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  market_size_year:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  tam_value:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    context_budget_tokens: 1600
    max_evidence_chunks: 5
    sub_budget: market_context
    required_context:
      - region
      - year
      - source
  tam_currency:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context
  tam_year:
    category: C
    resolution_type: market_model
    allow_proxy: true
    if_missing: manual_needed
    sub_budget: market_context

  # ── D 类：私有经营指标 ──
  arr:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  cac:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: product_context
    refetchable: false
    confirm_requires_sources:
      - financial_database
      - founder_interview
      - company_financials
    fallback:
      - industry_avg
  ltv:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  churn_rate:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  retention_rate:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  gross_margin:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  burn_rate:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  runway_months:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  revenue_metrics:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  growth_metrics:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
  mau:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: product_context
    refetchable: false
  mau_as_of:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
    refetchable: false
  retention_definition:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
    refetchable: false
  ltv_cac_is_benchmark:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
    refetchable: false
    note: "0=公司实际披露，1=行业基准替代（不代表公司披露）"
  ltv_cac_benchmark_source:
    category: D
    resolution_type: private_metric
    allow_proxy: false
    if_missing: unavailable
    refetchable: false

  # ── E 类：B2B 不适配（根据 company_type 判定）──
  active_users:
    category: E
    resolution_type: b2b_remap
    b2b_replace: active_accounts
    if_missing: not_applicable
  registered_users:
    category: E
    resolution_type: b2b_remap
    b2b_replace: registered_accounts
    if_missing: not_applicable
  paying_users:
    category: E
    resolution_type: b2b_remap
    b2b_replace: paying_customers
    if_missing: not_applicable

  # ── 枚举字段（已由 3 层提取 + Pydantic 验证处理）──
  ai_model_dependency:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  workflow_integration_level:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  data_flywheel:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  proprietary_data_asset:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  incumbent_direct_competitor:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  customer_segment_type:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  funding_stage:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  pricing_model:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  inference_cost_exposure:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable
  stack_layer:
    category: A
    resolution_type: enum_extraction
    if_missing: unavailable

  # ── 评分字段（由 competitive_scoring 公式生成）──
  score_defensibility:
    category: B
    resolution_type: derived
    if_missing: derived
    formula: "SCORE_DEFENSIBILITY(ai_model_dependency, workflow_integration_level, data_flywheel)"
    required_inputs: [ai_model_dependency, workflow_integration_level, data_flywheel]
  score_incumbent_attention:
    category: B
    resolution_type: derived
    if_missing: derived
    formula: "SCORE_INCUMBENT(incumbent_direct_competitor, stack_layer)"
    required_inputs: [incumbent_direct_competitor, stack_layer]
  score_value_capture:
    category: B
    resolution_type: derived
    if_missing: derived
    formula: "SCORE_VALUE_CAPTURE(pricing_model, customer_segment_type, funding_stage)"
    required_inputs: [pricing_model, customer_segment_type, funding_stage]

  # ── L2 商业模式画布（结构化 JSON）──
  business_canvas:
    category: A
    resolution_type: structured_extraction
    if_missing: unavailable
    type: json_text
    source_module: business_canvas

  moat_dimensions:
    category: A
    resolution_type: structured_extraction
    if_missing: unavailable
    type: json_text
    source_module: business_canvas

  growth_loops:
    category: A
    resolution_type: structured_extraction
    if_missing: unavailable
    type: json_text
    source_module: business_canvas

  unit_economics:
    category: D
    resolution_type: private_metric
    if_missing: unavailable
    source_module: business_canvas

  # ── 其余：统一按 LLM 提取处理 ──
  _default:
    category: A
    resolution_type: llm_extract
    if_missing: unavailable
