    if_missing: unavailable
    sub_budget: gtm_context

  # -- 竞争/壁垒 --
  competitors:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: competition_context
  competitors_top3:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    type: json_text
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: competition_context
  competitors_summary:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: competition_context
  competitive_position:
    category: A
    resolution_type: structured_extraction
    if_missing: unavailable
    source_module: competitive_matrix

  competitors_structured:
    category: A
    resolution_type: structured_extraction
    if_missing: unavailable
    type: json_text
    source_module: competitive_matrix
  competitive_advantages:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: competition_context
  differentiation_strategy:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    aliases: [differentiated_opportunity]
    note: "v1/v2 使用 differentiation_strategy，v3 使用 differentiated_opportunity"
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: competition_context
  differentiated_opportunity:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: competition_context
    note: "v3 专用字段，基于竞品弱点 + L2 增长循环"
  moat:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 1200
    max_evidence_chunks: 3
