<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aistartups.cn — 研究台</title>
<link rel="icon" type="image/jpeg" href="/images/gzh-logo.jpg">
<link rel="apple-touch-icon" href="/images/gzh-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Instrument+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/gzh2-base.css">
<link rel="stylesheet" href="/static/css/editor.css">
</head>
<body>
<header id="top-bar" class="top-bar">
  <a href="/"><img src="/images/gzh-logo.jpg" class="topbar-logo" alt="aistartups.cn"></a>
  <span class="page-label">研究台</span>
  <span class="spacer"></span>
  <a class="top-link" href="/editor">定稿台</a>
</header>

<main id="research-desk">
  <section class="research-hero">
    <div class="hero-section-title">开始研究</div>
    <div class="research-inputs">
      <label for="research-company-name">公司名</label>
      <input id="research-company-name" type="text" placeholder="例如 Anthropic">
      <label for="research-company-url">官网 URL</label>
      <input id="research-company-url" type="url" placeholder="https://www.anthropic.com">
      <button id="btn-start-research" class="btn btn-primary">开始研究</button>
    </div>
    <div class="research-options-panel" aria-label="研究模块选项">
      <div class="research-options-head">
        <div>
          <div class="research-options-title">研究模块</div>
          <p id="research-options-summary">按本次研究选择采集来源和治理环节。</p>
        </div>
        <button id="btn-reset-research-options" class="btn btn-sm" type="button">恢复默认</button>
      </div>
      <div class="research-options-grid">
        <div class="research-option-group">
          <div class="research-option-group-title">采集来源</div>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="scrapling_search" checked>
            <span></span><strong>开放网页搜索</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="official_site" checked>
            <span></span><strong>官网抓取</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="tavily_search" checked>
            <span></span><strong>Tavily 补搜</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="tavily_extract" checked>
            <span></span><strong>Tavily 深抓</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="github" checked>
            <span></span><strong>GitHub</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="producthunt" checked>
            <span></span><strong>Product Hunt</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="youtube" checked>
            <span></span><strong>YouTube</strong>
          </label>
        </div>
        <div class="research-option-group">
          <div class="research-option-group-title">数据源补充</div>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="sec" checked>
            <span></span><strong>SEC</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="companieshouse" checked>
            <span></span><strong>Companies House</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="openbb" checked>
            <span></span><strong>OpenBB</strong>
          </label>
<label class="research-toggle">
            <input type="checkbox" data-research-option="whatweb" checked>
            <span></span><strong>WhatWeb</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="gap_refetch" checked>
            <span></span><strong>缺口补采</strong>
          </label>
        </div>
        <div class="research-option-group">
          <div class="research-option-group-title">证据治理</div>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="document_chunking" checked>
            <span></span><strong>文档切块</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="context_packer" checked>
            <span></span><strong>上下文打包</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="evidence_span_binding" checked>
            <span></span><strong>证据绑定</strong>
          </label>
          <label class="research-toggle">
            <input type="checkbox" data-research-option="image_collection" checked>
            <span></span><strong>图片采集</strong>
          </label>
        </div>
      </div>
    </div>
    <div class="progress-shell hidden" id="research-progress">
      <div class="progress-meta">
        <span id="research-stage">待命</span>
        <span id="research-percent">0%</span>
        <button id="btn-stop-research" class="btn btn-sm" style="display:none;color:#EF4444;border-color:#EF4444;margin-left:auto">
          ⏹ 停止
        </button>
      </div>
      <div class="progress-bar"><div id="research-progress-fill"></div></div>
      <div id="research-detail" class="research-detail"></div>
      <div id="research-step-track" class="research-step-track" aria-label="研究阶段"></div>
      <div id="research-event-list" class="research-event-list" aria-label="最近研究进度"></div>
      <div id="source-status-grid" class="source-status-grid" aria-label="采集链路状态"></div>
    </div>
    <div id="research-complete" class="research-complete hidden"></div>
  </section>

  <section class="company-library">
    <div class="library-header">
      <div>
        <div class="hero-section-title">公司库</div>
        <p>按研究时间倒序排列，点击「定稿」进入下一工序。</p>
      </div>
      <button id="btn-refresh-companies" class="btn">刷新</button>
    </div>
    <table class="company-table">
      <thead>
        <tr>
          <th>公司名</th>
          <th>研究时间</th>
          <th>数据完整度</th>
          <th>定稿进度</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="company-table-body">
        <tr><td colspan="5">加载中...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<script src="/static/js/api.js"></script>
<script src="/static/js/index.js"></script>
</body>
</html>
