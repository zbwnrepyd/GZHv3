    if_missing: unavailable
    type: json_text
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: customer_context
  ideal_customer_profile:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: customer_context
  customer_segment:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: customer_context
  customer_segment_primary:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: customer_context
  customer_segment_secondary:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: customer_context

  # -- 商业/增长 --
  revenue_model:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: gtm_context
  gtm_motion:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    aliases: [gtm_strategy]
    note: "v1/v2 使用 gtm_motion，v3 使用 gtm_strategy"
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: gtm_context
  growth_strategy:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: gtm_context
  acquisition_channels:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    type: json_text
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: gtm_context
  growth_flywheel:
