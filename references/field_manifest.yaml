# 字段解析清单 — 定义每个字段的获取策略、来源要求、回退行为
# 配合 field_status.py 在 L3 提取后给 research_fields 打 resolution_status 标签
#
# 五类字段：
#   A 直接事实 — 官方来源 / LinkedIn / Crunchbase / 新闻稿
#   B 公式计算 — 输入 confirmed 则自动 derived
#   C 市场估算 — 市场报告 + 赛道边界，多为 proxy/manual_needed
#   D 私有经营 — 默认 unavailable，仅可信来源披露才补
#   E B2B不适配 — 根据 company_type 标记 not_applicable

fields:
  # ── A 类：直接事实 ──
  company_name:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  company_type:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  location:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  company_def:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  founded_date:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  core_business:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: product_context
  core_competency:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: product_context
  industry_positioning:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  company_achievement:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    aliases: [company_achievements]
    note: "v1/v2 使用 company_achievement，v3 使用 company_achievements（复数）"
  founder_name:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 1600
    max_evidence_chunks: 4
    sub_budget: founder_context
    keywords:
      - founder
      - CEO
      - co-founder
      - 创始人
  founder_edu:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 3
    sub_budget: founder_context
    keywords:
      - education
      - university
      - degree
      - PhD
      - 学士
      - 硕士
      - 博士
  founder_bg:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: founder_context
  founder_achievement:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: founder_context
  team_size:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  team_highlight:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  funding_info:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 1600
    max_evidence_chunks: 5
    sub_budget: founder_context
    preferred_sources:
      - official_blog
      - press_release
      - trusted_media
      - financial_database
    keywords:
      - funding
      - raised
      - Series A
      - Series B
      - Series C
      - valuation
      - investor
      - 融资
      - 估值
  website_url:
    category: A
    resolution_type: official_fact
    if_missing: unavailable

  # -- 产品相关 --
  main_product_name:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: product_context
  main_product_def:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: product_context
  main_product_highlight:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: product_context
  main_product_achievement:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    sub_budget: product_context
  main_product_img_src:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
  product_pain_points:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    type: json_text
    context_budget_tokens: 1200
    max_evidence_chunks: 3
    sub_budget: product_context
  product_core_features:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    type: json_text
    context_budget_tokens: 1200
    max_evidence_chunks: 3
    sub_budget: product_context
  product_usage_playbook:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: product_context
  tech_stack:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    aliases: [product_tech_stack]
    note: "v1/v2 使用 tech_stack，v3 使用 product_tech_stack"
  other_products:
    category: A
    resolution_type: official_fact
    if_missing: unavailable

  # -- 定价 --
  pricing_summary:
    category: A
    resolution_type: official_fact
    if_missing: unavailable
    context_budget_tokens: 800
    max_evidence_chunks: 2
    sub_budget: product_context
  pricing_tiers:
    category: A
    resolution_type: official_fact
